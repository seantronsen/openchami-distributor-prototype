# Builds openchami-keyring from keys/ and publishes it like an admitted release
# (docs/operations/archive-key/README.md).
name: keyring

on:
  push:
    branches: [main]
    paths: ['keys/**']
  workflow_dispatch:

# Writes the target and state, like poll.
concurrency:
  group: poll
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nfpm
        run: |
          scripts/install-nfpm.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the keyring
        env:
          ARCHIVE_GPG_KEY: ${{ secrets.ARCHIVE_GPG_KEY }}
          ARCHIVE_GPG_PASSPHRASE: ${{ secrets.ARCHIVE_GPG_PASSPHRASE }}
        run: scripts/keyring.sh admit
      - name: Upload admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyring-admit-0
          path: |
            admit/result.json
            admit/files/
          retention-days: 7

  publish:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/_publish.yml
    with:
      prefix: keyring
    secrets:
      ARCHIVE_GPG_KEY: ${{ secrets.ARCHIVE_GPG_KEY }}
      ARCHIVE_GPG_PASSPHRASE: ${{ secrets.ARCHIVE_GPG_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  record:
    needs: publish
    permissions:
      contents: write   # commit state
      issues: write
    uses: ./.github/workflows/_record.yml
    with:
      artifacts: keyring-*
