#
# tests/integration/config.defaults.yaml
#
# =============================================================================
# Distributor Integration Tests - Default Configuration
# =============================================================================
#
# DO NOT EDIT THIS FILE. It holds every setting the integration tests read,
# with its default value, and is part of the test code.
#
# To customize, create your own config file with only the keys you want to
# change, copied from here:
#
#   ~/.config/distributor-it/config.yaml   ($XDG_CONFIG_HOME is respected)
#
# The IT_CONFIG environment variable picks another file instead. Nothing writes
# to either file. Secrets never go in them: the GitHub token comes from gh, and
# git pushes through your SSH agent.
#
# Configuration precedence (highest first):
#   1. your config file
#   2. this file
#
# A key set in neither is an error, except where noted.

# -------------------------------------------------------------------------
# Code Under Test
# -------------------------------------------------------------------------

# The code each throwaway repo is templated from: copied to a temporary
# directory, then force-pushed to the repo with the suite's changes. Each entry
# is one of:
#
#   path: a local checkout. Its HEAD commit is used, and tracked files must be
#         committed. Relative paths start at this repo's root. Git worktrees
#         work.
#   repo: a GitHub repo (owner/name), fetched anonymously over HTTPS, with
#   ref:  a commit, tag, or branch (optional; default: its latest release).
#
# An entry in your config file replaces the whole entry here: setting path
# drops repo and ref, and the other way round.
checkouts:
  # The distributor.
  #
  # Default: this repo
  distributor:
    path: .

  # The testbed (a service repo with real release builds).
  #
  # Default: OpenCHAMI/github-actions-testbed at its latest release
  testbed:
    repo: OpenCHAMI/github-actions-testbed

# -------------------------------------------------------------------------
# Throwaway Repos
# -------------------------------------------------------------------------

# The throwaway repos (owner/name), all three or none. They're overwritten
# completely on every run: use repos made for this only.
#
# Normally left unset: init.sh creates random ones and records them in its
# state file (~/.local/state/distributor-it/repos.yaml), and destroy.sh
# deletes them. Set here, they're used instead, and init.sh and destroy.sh
# leave them alone. The second service repo's name should start with the
# testbed's plus "-" (package-rules' longer-name check needs it).
#
# Default: unset (the state file's)
#repos:
#  distributor: you/my-distributor
#  testbed: you/my-testbed
#  service2: you/my-testbed-tools

# -------------------------------------------------------------------------
# Containers
# -------------------------------------------------------------------------

images:
  # The tools container both suites run in.
  #
  # Default: docker.io/library/debian:13
  tools: docker.io/library/debian:13

  # distro: the Fedora target (dnf installs).
  #
  # Default: docker.io/library/fedora:42
  fedora: docker.io/library/fedora:42

  # distro: the Debian target (apt installs).
  #
  # Default: docker.io/library/debian:13
  debian: docker.io/library/debian:13

  # distro: the temporary S3 gateway.
  #
  # Default: docker.io/versity/versitygw:v1.10.0
  versitygw: docker.io/versity/versitygw:v1.10.0

# The container engine: podman or docker. The distro tests need rootless
# podman (their tools container gets its socket).
#
# Default: unset (rootless podman, else podman, else docker: the first
#          installed)
#engine: podman

# -------------------------------------------------------------------------
# Runs
# -------------------------------------------------------------------------

# Where run reports, settings, and exported artifacts go, one directory per
# run (<output_dir>/<run id>). Kept after the run.
#
# Default: /tmp/distributor-it
output_dir: /tmp/distributor-it

# Longest any single wait on GitHub may take, in seconds.
#
# Default: 3600
timeout: 3600

# Pause between checks while waiting on GitHub, in seconds.
#
# Default: 10
poll_interval: 10

# Leave the GitHub repos as the run's last test left them (no end-of-run
# cleanup), for inspection. Every test still resets them before it starts.
#
# Default: false
keep: false

# -------------------------------------------------------------------------
# S3 Gateway (distro)
# -------------------------------------------------------------------------

gateway:
  # Root credentials of the temporary S3 gateway (versitygw). Not secret: it's
  # reachable only from the containers on its private network (and 127.0.0.1
  # when kept), and it serves public test data.
  #
  # Default: it / distributor-it
  access_key: it
  secret_key: distributor-it

  # Leave the gateway running after its test file, with its files, published
  # on 127.0.0.1:<port>, for inspection. The end of the test file logs how to
  # remove it; nothing removes it automatically.
  #
  # Default: false
  keep: false

  # Host port a kept gateway is published on (127.0.0.1 only).
  #
  # Default: 7070
  port: 7070
